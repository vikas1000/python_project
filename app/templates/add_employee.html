{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

        {# Breadcrumb #}
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/home">Home</a></li>
                <li class="breadcrumb-item"><a href="/employee/list">Employees</a></li>
                <li class="breadcrumb-item active">Add Employee</li>
            </ol>
        </nav>

        <div class="card">
            <div class="card-header bg-primary text-white py-3">
                <h5 class="mb-0 fw-semibold">
                    <i class="bi bi-person-plus-fill me-2"></i>Add New Employee
                </h5>
            </div>

            <div class="card-body p-4">
                <form action="/employee/add" method="POST" novalidate>

                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">
                            <i class="bi bi-person me-1 text-secondary"></i>Full Name
                        </label>
                        <input type="text" id="name" name="name"
                               class="form-control" placeholder="e.g. John Smith" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">
                            <i class="bi bi-envelope me-1 text-secondary"></i>Email Address
                        </label>
                        <input type="email" id="email" name="email"
                               class="form-control" placeholder="e.g. john@company.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">
                            <i class="bi bi-lock me-1 text-secondary"></i>Password
                        </label>
                        <input type="password" id="password" name="password"
                               class="form-control" placeholder="Enter password" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="salary" class="form-label fw-semibold">
                                <i class="bi bi-cash-stack me-1 text-secondary"></i>Salary (₹)
                            </label>
                            <input type="number" id="salary" name="salary"
                                   class="form-control" placeholder="e.g. 50000"
                                   min="0" step="0.01" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="department" class="form-label fw-semibold">
                                <i class="bi bi-building me-1 text-secondary"></i>Department
                            </label>
                            <input type="text" id="department" name="department"
                                   class="form-control" placeholder="e.g. Engineering" required>
                        </div>
                    </div>

                    <hr class="my-4">

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle me-1"></i>Save Employee
                        </button>
                        <button type="reset" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-counterclockwise me-1"></i>Reset
                        </button>
                        <a href="/employee/list" class="btn btn-outline-dark ms-auto">
                            <i class="bi bi-arrow-left me-1"></i>Back to List
                        </a>
                    </div>

                </form>
            </div>
        </div>

    </div>
</div>

{% endblock %}
