services:
  - type: web
    name: flask-ems
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ems-db
          property: connectionString
      - key: FLASK_DEBUG
        value: "false"

databases:
  - name: ems-db
    databaseName: employee_db
    user: ems_user
    plan: free
